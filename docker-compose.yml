services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - soc-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -Eq '\"status\":\"(yellow|green)\"'"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - soc-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soc_noc
      POSTGRES_USER: ${POSTGRES_USER:-soc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_dev_password_CHANGE_ME}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_user} -d soc_noc"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - soc-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    environment:
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://soc_user:soc_dev_password_CHANGE_ME@postgres:5432/soc_noc}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - JWT_ALGORITHM=HS256
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - DEBUG=${DEBUG:-true}
      - STARTUP_MAX_RETRIES=${STARTUP_MAX_RETRIES:-60}
      - STARTUP_RETRY_DELAY=${STARTUP_RETRY_DELAY:-2}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - soc-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - soc-network
    restart: unless-stopped

  honeypot:
    build:
      context: ./honeypot
      dockerfile: ../docker/Dockerfile.honeypot
    environment:
      - REDIS_URL=redis://redis:6379
      - HONEYPOT_PORT=2222
      - HONEYPOT_HOST=0.0.0.0
    ports:
      - "${HONEYPOT_PORT:-2222}:2222"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 2222), 2); s.close()"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - soc-network
    restart: unless-stopped

  agent:
    build:
      context: ./agents
      dockerfile: ../docker/Dockerfile.agent
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_FILES=/host/logs/auth.log,/host/logs/syslog
      - STARTUP_MAX_RETRIES=${STARTUP_MAX_RETRIES:-60}
      - STARTUP_RETRY_DELAY=${STARTUP_RETRY_DELAY:-2}
    volumes:
      - /var/log:/host/logs:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - soc-network
    restart: unless-stopped

  processor:
    build:
      context: ./processor
      dockerfile: ../docker/Dockerfile.processor
    environment:
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://soc_user:soc_dev_password_CHANGE_ME@postgres:5432/soc_noc}
      - STARTUP_MAX_RETRIES=${STARTUP_MAX_RETRIES:-60}
      - STARTUP_RETRY_DELAY=${STARTUP_RETRY_DELAY:-2}
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import os,time,sys; p='/tmp/processor_heartbeat'; sys.exit(0 if os.path.exists(p) and (time.time() - os.path.getmtime(p)) < 45 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - soc-network
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
      dockerfile: ../docker/Dockerfile.simulator
    environment:
      - HONEYPOT_HOST=honeypot
      - HONEYPOT_PORT=2222
    depends_on:
      honeypot:
        condition: service_healthy
    profiles:
      - simulation
    networks:
      - soc-network
    restart: unless-stopped

volumes:
  redis_data:
  es_data:
  pg_data:

networks:
  soc-network:
    driver: bridge
